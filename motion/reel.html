<script>
// Reel del portafolio. Todo sale de render(t): el mismo t da siempre el mismo cuadro, así se exporta a 60 fps.
// Abrir reel.html lo reproduce; reel.html?t=12.5 congela ese instante.
const W = 1920, H = 1080, C = document.getElementById('c'), X = C.getContext('2d');
const P = { bg: '#120e1d', surface: '#1b1629', surface2: '#231c35', line: '#302743', text: '#f4f0f7', soft: '#d9d1e6', muted: '#b7aec4', dim: '#7d7394',

// Tiempo y curvas
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));

const lerp = (a, b, k) => a + (b - a) * k;
const E = {

const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const A = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const mix = (h1, h2, k) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const c = s => Math.round(lerp(a >> s & 255, b >> s & 255, k)); return `rgb(${c(16)},${c(8)},${c(0)})`; };

// Texto
function setFont(g, o) { g.font = `${o.it ? 'italic ' : ''}${o.w ?? 700} ${o.size ?? 40}px ${o.f ?? 'Bri'}`; g.letterSpacing = `${o.sp ?? 0}px`; }
function T(g, s, x, y, o = {}) {
 g.save(); g.globalAlpha *= o.a ?? 1; setFont(g, o); g.fillStyle = o.c ?? P.text; g.textAlign = o.al ?? 'left'; g.textBaseline = 'alphabetic';

}
function TW(g, s, o = {}) { g.save(); setFont(g, o); const w = g.measureText(s).width; g.restore(); return w; }
// Letra por letra desde una máscara; out > 0 las saca hacia arriba.
function rise(g, s, x, y, k, o = {}, out = 0, stag = .045) {

  const ki = E.outExpo(clamp(k * total - i * stag)), ko = E.inExpo(clamp(out * total - i * stag));

}
const GLY = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/<>_#*+=';
// Se resuelve de izquierda a derecha pasando por caracteres al azar (sólo para mono: el ancho no cambia).

// Fondo: capas fijas calculadas una vez

{ const d = dots.getContext('2d'); d.fillStyle = 'rgba(255,255,255,.075)'; for (let y = 13; y < H + 26; y += 26) for (let x = 13; x < W + 26; x += 26) { d.beginPath(); d.arc(x, y, 1, 0, 7); d.fill(); } }

{ const d = noise.getContext('2d'), im = d.createImageData(256, 256); let s = 9; for (let i = 0; i < im.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = s % 256; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; } d.putImageData(im, 0, 0); }

}

// ——— 01 · NFC ———

<html lang="es"><head><meta charset="utf-8"><title>Reel</title>
<style>
@font-face{font-family:Manrope;src:url(../node_modules/@fontsource-variable/manrope/files/manrope-latin-wght-normal.woff2) format('woff2');font-weight:200 800}
@font-face{font-family:DM;src:url(../node_modules/@fontsource-variable/dm-sans/files/dm-sans-latin-wght-normal.woff2) format('woff2');font-weight:100 1000}

</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Reel de 15 s. Todo sale de render(t): el mismo t siempre da el mismo cuadro, así se puede exportar a 60 fps.
const W = 1920, H = 1080, C = document.getElementById('c'), X = C.getContext('2d');
const buf = document.createElement('canvas'); buf.width = W; buf.height = H; const B = buf.getContext('2d');
const low = document.createElement('canvas'); const L = low.getContext('2d');
const COL = { bg: '#0e1016', ink: '#161922', text: '#eef0f5', muted: '#8d93a3', mint: '#7fe3c6', violet: '#b9a7ff', amber: '#ffbd7a', coral: '#ff8e7c' };

// Tiempo y curvas
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const outExpo = k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k);
const inExpo = k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10);
const inOutCubic = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
const outBack = (k, s = 1.7) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2);
const spring = k => k <= 0 ? 0 : 1 - Math.exp(-7 * k) * Math.cos(11 * k);
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const hex = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
const mix = (h1, h2, k) => { const a = parseInt(h1.slice(1), 16), b = parseInt(h2.slice(1), 16); const c = s => Math.round(lerp(a >> s & 255, b >> s & 255, k)); return `rgb(${c(16)},${c(8)},${c(0)})`; };

// Datos fijos: polvo de fondo, celdas y partículas
const DUST = Array.from({ length: 90 }, () => ({ x: rnd() * W, y: rnd() * H, z: .3 + rnd() * .7, r: .6 + rnd() * 1.8 }));
const CELLS = []; for (let r = 0; r < 7; r++) for (let c = 0; c < 9; c++) CELLS.push({ r, c, bad: rnd() < .16, w: .5 + rnd() * .45 });
const SHARDS = Array.from({ length: 220 }, () => { const a = rnd() * Math.PI * 2, d = rnd(); return { a, d, v: 400 + rnd() * 1100, s: 6 + rnd() * 14, spin: rnd() * 6 - 3, col: [COL.mint, COL.violet, COL.amber, COL.coral][Math.floor(rnd() * 4)] }; });
const BRANCHES = [['folio', -1, -2], ['fecha', -1, -1], ['turno', -1, 0], ['linea', -1, 1], ['modelo', -1, 2], ['estación', 1, -2], ['defecto', 1, -1], ['severidad', 1, 0], ['piezas', 1, 1], ['rechazos', 1, 2]];

function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function text(g, s, x, y, size, color, weight = 700, align = 'left', font = 'Manrope', spacing = 0) {
 g.font = `${weight} ${size}px ${font}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'alphabetic';
 if ('letterSpacing' in g) g.letterSpacing = `${spacing}px`; g.fillText(s, x, y); if ('letterSpacing' in g) g.letterSpacing = '0px';
}
// Texto que sube letra por letra detrás de una máscara
function riseText(g, s, x, y, size, color, t0, t, stagger = .035, dur = .7, weight = 750, align = 'center') {
 g.font = `${weight} ${size}px Manrope`; const total = g.measureText(s).width;
 let cx = align === 'center' ? x - total / 2 : x;
 g.save(); g.beginPath(); g.rect(0, y - size * 1.05, W, size * 1.35); g.clip();
 for (let i = 0; i < s.length; i++) {
  const ch = s[i], w = g.measureText(ch).width, k = outExpo(seg(t, t0 + i * stagger, t0 + i * stagger + dur));
  g.fillStyle = color; g.textAlign = 'left'; g.fillText(ch, cx, y + (1 - k) * size * 1.1); cx += w;
 }
 g.restore();
}

function background(g, t) {
 g.fillStyle = COL.bg; g.fillRect(0, 0, W, H);
 // Auroras que respiran
 const blobs = [[.15, .2, COL.mint, 0], [.85, .25, COL.violet, 2], [.7, .95, COL.amber, 4]];
 for (const [bx, by, c, ph] of blobs) {
  const x = (bx + .04 * Math.sin(t * .6 + ph)) * W, y = (by + .05 * Math.cos(t * .5 + ph)) * H, r = 620 + 60 * Math.sin(t * .8 + ph);
  const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, hex(c, .13)); gr.addColorStop(1, hex(c, 0)); g.fillStyle = gr; g.fillRect(0, 0, W, H);
 }
 // Polvo con paralaje
 for (const d of DUST) { const x = (d.x + t * 40 * d.z) % W, y = (d.y - t * 18 * d.z + H) % H; g.fillStyle = hex(COL.text, .08 + .18 * d.z); g.beginPath(); g.arc(x, y, d.r * d.z, 0, 7); g.fill(); }
}

// Escena 1 (0–2.5): tres luces chocan y aparece el nombre
function s1(g, t) {
 const cx = W / 2, cy = H / 2 - 40;
 const orbs = [[COL.mint, -300, 900], [COL.violet, 2200, -200], [COL.amber, 2100, 1300]];
 const k = outExpo(seg(t, .05, 1.05));
 for (const [c, sx, sy] of orbs) {
  for (let i = 7; i >= 0; i--) {
   const kk = outExpo(seg(t - i * .018, .05, 1.05)), px = lerp(sx, cx, kk) + Math.sin(kk * 3.1) * 140 * (1 - kk), py = lerp(sy, cy, kk);
   g.fillStyle = hex(c, (1 - i / 8) * .55 * (1 - seg(t, 1.05, 1.3))); g.beginPath(); g.arc(px, py, 26 - i * 2, 0, 7); g.fill();
  }
 }
 // Onda del choque
 const w = seg(t, 1.02, 1.9);
 if (w > 0 && w < 1) { g.strokeStyle = hex(COL.text, .5 * (1 - w)); g.lineWidth = 3 * (1 - w) + .5; g.beginPath(); g.arc(cx, cy, 30 + outExpo(w) * 900, 0, 7); g.stroke();
  g.strokeStyle = hex(COL.mint, .35 * (1 - w)); g.beginPath(); g.arc(cx, cy, 30 + outExpo(w) * 600, 0, 7); g.stroke(); }
 const flash = seg(t, 1.0, 1.08) - seg(t, 1.08, 1.5); if (flash > 0) { const gr = g.createRadialGradient(cx, cy, 0, cx, cy, 380); gr.addColorStop(0, hex('#ffffff', .55 * flash)); gr.addColorStop(1, hex('#ffffff', 0)); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
 // Nombre y subtítulo
 const out = inExpo(seg(t, 2.15, 2.5));
 g.save(); g.translate(-out * 1400, 0); g.globalAlpha = 1;
 riseText(g, 'Bruno Salas', cx, cy + 60, 176, COL.text, 1.08, t, .032, .8, 780);
 const sub = outExpo(seg(t, 1.55, 2.1));
 g.globalAlpha = sub; text(g, 'MOTION  ·  WEB  ·  DATA', cx, cy + 150 + (1 - sub) * 30, 30, COL.muted, 600, 'center', 'DM', 10);
 // Subrayado que se dibuja
 const u = inOutCubic(seg(t, 1.5, 2.1)); const gr = g.createLinearGradient(cx - 380, 0, cx + 380, 0); gr.addColorStop(0, COL.mint); gr.addColorStop(.5, COL.violet); gr.addColorStop(1, COL.amber);
 g.globalAlpha = 1; g.fillStyle = gr; g.fillRect(cx - 380, cy + 95, 760 * u, 5);
 g.restore();
}

// Escena 2 (2.4–4.9): tipografía cinética
function s2(g, t) {
 const words = [['Diseño', COL.mint, -1], ['Código', COL.violet, 1], ['Movimiento', COL.amber, -1]];
 words.forEach(([wd, c, dir], i) => {
  const t0 = 2.45 + i * .22, k = outBack(clamp(seg(t, t0, t0 + .75)), 1.2), leave = Math.pow(seg(t, 4.25 + i * .06, 4.85 + i * .06), 3);
  const y = 360 + i * 205, x = W / 2 + dir * (1 - k) * 1500 - dir * leave * 1600;
  g.save(); g.translate(x, y); g.transform(1, 0, dir * -.18 * (1 - k), 1, 0, 0);
  text(g, wd, 0, 0, 190, i === 1 ? COL.text : c, 800, 'center');
  g.restore();
  // Línea de velocidad
  const sp = seg(t, t0, t0 + .35) - seg(t, t0 + .35, t0 + .7); if (sp > 0) { g.fillStyle = hex(c, .35 * sp); g.fillRect(x - dir * 700 - 300, y - 60, 600, 4); }
 });
 const n = seg(t, 3.2, 3.6) - seg(t, 4.3, 4.6);
 g.globalAlpha = clamp(n); text(g, '15 segundos, 60 cuadros por segundo, todo en canvas.', W / 2, 1000, 26, COL.muted, 500, 'center', 'DM'); g.globalAlpha = 1;
}

// Escena 3 (4.7–8.1): club NFC
function s3(g, t) {
 const enter = outBack(seg(t, 4.75, 5.45), 1.1), zoom = inExpo(seg(t, 7.65, 8.15));
 const px = 760, py = lerp(1500, 540, enter);
 const tap = Math.sin(Math.PI * seg(t, 5.55, 6.05)), phoneX = px + tap * 170;
 g.save();
 // Cámara que entra a la tarjeta al final
 g.translate(W / 2, H / 2); g.scale(1 + zoom * 7, 1 + zoom * 7); g.translate(-W / 2 - (phoneX - W / 2) * zoom, -H / 2 - (py - 60 - H / 2) * zoom);
 // Chip
 const cx = 1180, cy = 540, chipIn = outBack(seg(t, 5.0, 5.5));
 for (let i = 0; i < 3; i++) { const r = ((t - 5.2 - i * .33) % 1 + 1) % 1; if (t > 5.2) { g.strokeStyle = hex(COL.mint, .6 * (1 - r) * chipIn); g.lineWidth = 3; roundRect(g, cx - 60 - r * 90, cy - 60 - r * 90, 120 + r * 180, 120 + r * 180, 24 + r * 30); g.stroke(); } }
 g.save(); g.translate(cx, cy); g.scale(chipIn, chipIn); roundRect(g, -60, -60, 120, 120, 24); g.fillStyle = '#12151d'; g.fill(); g.strokeStyle = COL.mint; g.lineWidth = 3; g.stroke(); text(g, 'NFC', 0, 12, 34, COL.mint, 800, 'center'); g.restore();
 // Destello del toque
 const hit = seg(t, 5.78, 5.84) - seg(t, 5.84, 6.2); if (hit > 0) { g.fillStyle = hex(COL.mint, .25 * hit); g.beginPath(); g.arc(cx - 40, cy, 160 + (1 - hit) * 200, 0, 7); g.fill(); }
 // Celular
 g.save(); g.translate(phoneX, py); g.rotate(-.05 * tap);
 roundRect(g, -190, -380, 380, 760, 54); g.fillStyle = '#07090d'; g.fill(); g.strokeStyle = '#2a2f3b'; g.lineWidth = 6; g.stroke();
 roundRect(g, -60, -360, 120, 30, 15); g.fillStyle = '#000'; g.fill();
 text(g, 'Wallet', -150, -270, 44, COL.text, 800);
 // Tarjeta que se voltea
 const flip = outBack(seg(t, 6.0, 6.55), 1.3);
 g.save(); g.translate(0, -90); g.scale(1, Math.max(.001, flip)); g.globalAlpha = clamp(flip * 3);
 const gr = g.createLinearGradient(-160, -130, 160, 130); gr.addColorStop(0, '#5e2414'); gr.addColorStop(1, '#a24a26');
 roundRect(g, -160, -130, 320, 260, 26); g.fillStyle = gr; g.fill();
 roundRect(g, -134, -104, 46, 46, 10); g.fillStyle = '#fff4ea'; g.fill(); text(g, 'EC', -111, -72, 20, '#8a3a1f', 800, 'center');
 text(g, 'El Cerrito', -76, -80, 26, '#fff4ea', 750); text(g, `${Math.min(8, Math.floor(seg(t, 6.3, 7.3) * 8 + (t > 6.3 ? 1 : 0)))}/8`, 136, -80, 26, '#fff4ea', 800, 'right');
 for (let i = 0; i < 8; i++) {
  const sx = -105 + (i % 4) * 70, sy = 10 + Math.floor(i / 4) * 70, k = outBack(seg(t, 6.3 + i * .12, 6.55 + i * .12), 2.2);
  g.strokeStyle = hex('#ffe2cc', .5); g.lineWidth = 2; g.setLineDash([6, 6]); g.beginPath(); g.arc(sx, sy, 26, 0, 7); g.stroke(); g.setLineDash([]);
  if (k > 0) { g.fillStyle = '#fff4ea'; g.beginPath(); g.arc(sx, sy, 26 * k, 0, 7); g.fill(); g.fillStyle = '#a24a26'; g.beginPath(); g.arc(sx, sy, 11 * k, 0, 7); g.fill(); }
 }
 g.restore();
 // Burbuja de WhatsApp
 const bub = spring(seg(t, 7.1, 7.9));
 if (bub > 0) { g.save(); g.translate(-10, 190); g.scale(bub, bub); roundRect(g, -150, -60, 300, 120, 18); g.fillStyle = '#1f2c34'; g.fill();
  text(g, '¿Qué tal estuvo todo?', -128, -18, 22, '#e9edef', 600, 'left', 'DM'); text(g, 'Dejar reseña en Google', -128, 28, 21, '#53bdeb', 700, 'left', 'DM'); g.restore(); }
 g.restore();
 // Rótulo
 const lab = outExpo(seg(t, 5.2, 5.9)) - inExpo(seg(t, 7.5, 7.8));
 g.globalAlpha = clamp(lab); text(g, 'CLUB NFC PARA LOCALES', 1380, 330, 22, COL.amber, 700, 'left', 'DM', 6); text(g, 'Un toque. Un sello.', 1380, 390, 50, COL.text, 780); text(g, 'Un cliente que vuelve.', 1380, 450, 50, COL.text, 780); g.globalAlpha = 1;
 g.restore();
}

// Escena 4 (8.0–11.1): datos que se limpian y se vuelven mapa
function s4(g, t) {
 // La tarjeta ámbar llena la pantalla y se parte en celdas
 const split = outExpo(seg(t, 8.12, 8.9));
 // La capa ámbar entra con la cámara que se mete a la tarjeta: sin corte
 const cover = inOutCubic(seg(t, 7.9, 8.12));
 const gx = W / 2 - 4.5 * 150, gy = 250;
 const collapse = inOutCubic(seg(t, 9.9, 10.35));
 const scan = seg(t, 9.0, 9.8), scanY = gy - 40 + scan * (7 * 80 + 80);
 // La cuadrícula empieza ampliada hasta cubrir la pantalla y se encoge a su sitio.
 const zoomIn = lerp(2.6, 1, split), gcx = gx + 4.5 * 150 - 6, gcy = gy + 3.5 * 80 - 10;
 if (split <= 0) { g.globalAlpha = cover; g.fillStyle = '#8e3d20'; g.fillRect(0, 0, W, H); g.globalAlpha = 1; }
 else for (const cell of CELLS) {
  const tx = gx + cell.c * 150, ty = gy + cell.r * 80;
  const gap = lerp(0, 1, split), cw = lerp(150, 138 * cell.w + 10, gap), ch = lerp(80, 60, gap);
  let x = gcx + (tx - gcx) * zoomIn - (split < 1 ? (1 - gap) * 6 : 0), y = gcy + (ty - gcy) * zoomIn, w = cw * zoomIn, h = ch * zoomIn;
  x = lerp(x, W / 2 - 20, collapse); y = lerp(y, H / 2 - 20, collapse); w = lerp(w, 40, collapse); h = lerp(h, 40, collapse);
  const cleaned = scanY > ty + 30;
  let c = mix('#8e3d20', '#1e222c', clamp(split * 1.3));
  if (cell.bad && split >= 1) c = cleaned ? mix(COL.coral, '#1f3a33', seg(scanY - ty - 30, 0, 90)) : mix('#1e222c', COL.coral, .55 + .45 * Math.sin(t * 9));
  g.globalAlpha = 1 - seg(t, 10.2, 10.4);
  roundRect(g, x, y, w, h, 10 * split); g.fillStyle = c; g.fill();
  if (split > .95 && collapse < .1) { g.fillStyle = cell.bad && cleaned ? COL.mint : hex(COL.text, .35); g.fillRect(x + 16, y + 26, (w - 32) * (cell.bad && !cleaned ? .9 : .6), 8); }
 }
 g.globalAlpha = 1;
 // Línea que escanea
 if (scan > 0 && scan < 1) { const gr = g.createLinearGradient(0, scanY - 60, 0, scanY); gr.addColorStop(0, hex(COL.mint, 0)); gr.addColorStop(1, hex(COL.mint, .45)); g.fillStyle = gr; g.fillRect(gx - 40, scanY - 60, 9 * 150 + 60, 60); g.fillStyle = COL.mint; g.fillRect(gx - 40, scanY, 9 * 150 + 60, 3); }
 const lab = outExpo(seg(t, 8.6, 9.1)) - inExpo(seg(t, 9.8, 10.0));
 g.globalAlpha = clamp(lab); text(g, 'ANALIZADOR DE CSV', gx - 20, 190, 22, COL.mint, 700, 'left', 'DM', 6); text(g, '7 problemas → 1 en un clic', gx + 9 * 150 - 20, 190, 30, COL.text, 700, 'right'); g.globalAlpha = 1;
 // Mapa mental que crece desde el centro
 const grow = seg(t, 10.3, 11.0), shrink = inExpo(seg(t, 10.85, 11.15));
 if (grow > 0) {
  const cx = W / 2, cy = H / 2;
  BRANCHES.forEach(([name, side, row], i) => {
   const k = outExpo(clamp((grow - i * .04) / .7)) * (1 - shrink);
   const ex = cx + side * 560 * k, ey = cy + row * 150 * k;
   const c = [COL.mint, COL.violet, COL.amber][i % 3];
   g.strokeStyle = hex(c, .8); g.lineWidth = 3; g.beginPath(); g.moveTo(cx, cy); g.bezierCurveTo(cx + side * 260 * k, cy, cx + side * 300 * k, ey, ex, ey); g.stroke();
   if (k > .3) { g.globalAlpha = clamp((k - .3) / .4); roundRect(g, ex - (side < 0 ? 200 : 0), ey - 30, 200, 60, 16); g.fillStyle = '#161922'; g.fill(); g.strokeStyle = c; g.lineWidth = 2; g.stroke();
    text(g, name, ex + (side < 0 ? -100 : 100), ey + 10, 26, COL.text, 700, 'center'); g.globalAlpha = 1; }
  });
  const nk = outBack(seg(t, 10.3, 10.6)) * (1 - shrink);
  g.save(); g.translate(cx, cy); g.scale(nk, nk); roundRect(g, -150, -46, 300, 92, 24); g.fillStyle = '#1e222c'; g.fill(); g.strokeStyle = COL.text; g.lineWidth = 2; g.stroke(); text(g, 'reporte.csv', 0, 12, 34, COL.text, 780, 'center'); g.restore();
 }
}

// Escena 5 (11.0–13.4): la esfera pasa de pixel art a suave y luego estalla
function sphere(g, cx, cy, r, t) {
 const lx = cx + Math.cos(t * 1.4) * r * .45, ly = cy - r * .45 + Math.sin(t * 1.4) * r * .15;
 const gr = g.createRadialGradient(lx, ly, r * .05, cx, cy, r); gr.addColorStop(0, '#f1ecff'); gr.addColorStop(.25, COL.violet); gr.addColorStop(.75, '#4b3e8f'); gr.addColorStop(1, '#1b1633');
 g.fillStyle = gr; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.fill();
 // Visor y ojos, guiño al protagonista del juego
 g.fillStyle = '#0b0a14'; roundRect(g, cx - r * .62, cy - r * .28, r * 1.24, r * .6, r * .3); g.fill();
 const blink = 1 - (seg(t, 12.2, 12.26) - seg(t, 12.26, 12.34));
 g.fillStyle = COL.mint; for (const s of [-1, 1]) { g.beginPath(); g.ellipse(cx + s * r * .26, cy + r * .02, r * .1, r * .13 * blink + .5, 0, 0, 7); g.fill(); }
 g.strokeStyle = hex('#ffffff', .25); g.lineWidth = r * .02; g.beginPath(); g.arc(cx, cy, r * .96, -2.4, -1.2); g.stroke();
}
function s5(g, t) {
 const cx = W / 2, cy = H / 2, grow = outBack(seg(t, 11.0, 11.5), 1.4), r = 300 * grow;
 const shatter = seg(t, 12.95, 13.9);
 if (shatter <= 0 && r > 1) {
  const px = Math.round(lerp(64, 1, inOutCubic(seg(t, 11.4, 12.7))));
  if (px <= 1) sphere(g, cx, cy, r, t);
  else {
   low.width = Math.ceil(W / px); low.height = Math.ceil(H / px); L.setTransform(1 / px, 0, 0, 1 / px, 0, 0); L.clearRect(0, 0, W, H); sphere(L, cx, cy, r, t);
   g.imageSmoothingEnabled = false; g.drawImage(low, 0, 0, low.width * px, low.height * px); g.imageSmoothingEnabled = true;
  }
 }
 // Estallido en píxeles
 if (shatter > 0) {
  for (const s of SHARDS) {
   const d = outExpo(shatter) * s.v * (.4 + s.d), x = cx + Math.cos(s.a) * (d + s.d * 280), y = cy + Math.sin(s.a) * (d + s.d * 280) + shatter * shatter * 300;
   g.save(); g.translate(x, y); g.rotate(s.spin * shatter); g.globalAlpha = 1 - shatter; g.fillStyle = s.col; g.fillRect(-s.s / 2, -s.s / 2, s.s, s.s); g.restore();
  }
  g.globalAlpha = 1;
 }
 const lab = outExpo(seg(t, 11.5, 12.0)) - inExpo(seg(t, 12.8, 13.0));
 const pxShown = Math.round(lerp(64, 1, inOutCubic(seg(t, 11.4, 12.7))));
 g.globalAlpha = clamp(lab); text(g, 'GAME DEV', 150, 470, 22, COL.violet, 700, 'left', 'DM', 6); text(g, 'Pixel art', 150, 540, 58, COL.text, 780); text(g, 'a 3D suave', 150, 610, 58, COL.text, 780);
 text(g, `píxel: ${pxShown}px`, 1770, 610, 30, COL.muted, 600, 'right', 'DM'); g.globalAlpha = 1;
}

// Escena 6 (13.3–15): cierre
function s6(g, t) {
 const cx = W / 2, cy = H / 2 - 30, k = seg(t, 13.35, 14.2);
 // Monograma que se traza
 g.save(); g.font = '800 220px Manrope'; g.textAlign = 'center'; g.lineWidth = 4; g.setLineDash([1400, 1400]); g.lineDashOffset = 1400 * (1 - inOutCubic(k));
 const gr = g.createLinearGradient(cx - 260, 0, cx + 260, 0); gr.addColorStop(0, COL.mint); gr.addColorStop(.5, COL.violet); gr.addColorStop(1, COL.amber);
 g.strokeStyle = gr; g.strokeText('BS', cx, cy); g.setLineDash([]);
 const fill = seg(t, 13.9, 14.35); g.globalAlpha = fill; g.fillStyle = gr; g.fillText('BS', cx, cy); g.restore();
 g.globalAlpha = 1;
 riseText(g, 'Bruno Salas', cx, cy + 120, 64, COL.text, 14.0, t, .025, .7, 760);
 const url = outExpo(seg(t, 14.25, 14.8)); g.globalAlpha = url; text(g, 'bruno-portfolio-azure.vercel.app', cx, cy + 180 + (1 - url) * 20, 28, COL.muted, 500, 'center', 'DM', 1); g.globalAlpha = 1;
}

function scene(g, t) {
 background(g, t);
 if (t < 2.6) s1(g, t);
 if (t > 2.35 && t < 4.95) s2(g, t);
 if (t > 4.7 && t < 8.12) s3(g, t);
 if (t > 7.88 && t < 11.2) s4(g, t);
 if (t > 10.95 && t < 13.95) s5(g, t);
 if (t > 13.3) s6(g, t);
 // Viñeta
 const v = g.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
}

// Desenfoque de movimiento: cada cuadro promedia 12 instantes dentro de su obturador.
window.render = (t, fps = 60, samples = 12) => {
 X.globalAlpha = 1; X.globalCompositeOperation = 'source-over';
 for (let i = 0; i < samples; i++) {
  const ts = t + (i / samples - .5) * (1 / fps) * .7;
  B.setTransform(1, 0, 0, 1, 0, 0); B.globalAlpha = 1; scene(B, ts);
  X.globalAlpha = 1 / (i + 1); X.drawImage(buf, 0, 0);
 }
 X.globalAlpha = 1;
};
window.ready = document.fonts.ready.then(() => Promise.all([document.fonts.load('800 100px Manrope'), document.fonts.load('600 30px DM')]));
if (!location.search.includes('export')) { const start = performance.now(); const loop = () => { window.render(((performance.now() - start) / 1000) % 15); requestAnimationFrame(loop); }; window.ready.then(loop); }

<script>
// Reel del portafolio. Todo sale de render(t): el mismo t da siempre el mismo cuadro, así se exporta a 60 fps.
// Abrir reel.html lo reproduce; reel.html?t=12.5 congela ese instante.
// Mismo papel, tinta y acento que la web (src/styles.css); verde, ámbar y rojo sólo marcan estado en los datos.
// Cifras y nombres salen de las demos: la planta ficticia (Líneas 1–3, lotes 4411–4428, INC-232), no de vitrina.
const W = 1920, H = 1080, C = document.getElementById('c'), X = C.getContext('2d');
const P = { bg: '#efece4', surface: '#f6f4ee', surface2: '#e6e2d7', line: '#cdc8bb', ink: '#1c1d1a', muted: '#5d5f58', acc: '#c4461b', ok: '#357044', warn: '#856010', bad: '#a8322a' };

// Tiempo y curvas
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
 outExpo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k),
 inExpo: k => k <= 0 ? 0 : Math.pow(2, 10 * k - 10),
 inOutExpo: k => k <= 0 ? 0 : k >= 1 ? 1 : k < .5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2,
 outCubic: k => 1 - Math.pow(1 - k, 3),
 inCubic: k => k * k * k,
 inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
 inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,

};

// Texto: Archivo ensanchada para títulos (como la web) y JetBrains Mono para rótulos y datos.
function setFont(g, o) { g.font = `${o.w ?? 650} ${o.size ?? 40}px ${o.f ?? 'Arc'}`; g.fontStretch = o.st ?? (o.f === 'Mono' ? 'normal' : 'semi-expanded'); g.letterSpacing = `${o.sp ?? 0}px`; }

 g.fillText(s, x, y); g.restore();
}
function TW(g, s, o = {}) { g.save(); setFont(g, o); const w = g.measureText(s).width; g.restore(); return w; }
function wrap(g, s, maxW, o) {

}
// Letra por letra desde una máscara; out > 0 las saca hacia arriba.
function rise(g, s, x, y, k, o = {}, out = 0, stag = .03) {

 const size = o.size ?? 40, n = s.length, total = 1 + stag * n, w = TW(g, s, o);

  if (s[i] === ' ') continue;
  const ki = E.outExpo(clamp(k * total - i * stag)), ko = E.inExpo(clamp(out * total - i * stag));
  if (ki <= 0 || ko >= 1) continue;
  T(g, s[i], x0 + TW(g, s.slice(0, i), o), y + (1 - ki) * size * 1.15 - ko * size * 1.15, { ...o, al: 'left' });
 }
 g.restore();
}
function typed(s, k) { return s.slice(0, Math.round(clamp(k) * s.length)); }
function caret(g, x, y, size, t, solid, c = P.acc) { if (!solid && (t * 1.7) % 1 > .55) return; g.fillStyle = c; g.fillRect(x + 3, y - size * .8, size * .48, size); }
function box(g, x, y, w, h, fill, stroke = P.line, lw = 1) {
 g.beginPath(); g.roundRect(x, y, w, h, 3);
 if (fill) { g.fillStyle = fill; g.fill(); }
 if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw; g.stroke(); }
}
function rule(g, x, y, w, c = P.line, h = 1) { g.fillStyle = c; g.fillRect(x, y, w, h); }

// Fondo: el papel de la hoja, sin manchas ni grano.
function backdrop(g) { g.fillStyle = P.bg; g.fillRect(0, 0, W, H); }
function finish(g, t) {
 const a = Math.max(1 - seg(t, 0, .5), seg(t, DUR - .7, DUR));
 if (a > 0) { g.fillStyle = A(P.bg, a); g.fillRect(0, 0, W, H); }
}
function pointer(g, x, y, press = 0, a = 1) {
 if (a <= 0) return;
 g.save(); g.globalAlpha = a; g.translate(x, y); g.scale(1.15 - press * .15, 1.15 - press * .15);
 g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 30); g.lineTo(8, 23); g.lineTo(14, 36); g.lineTo(19, 34); g.lineTo(13, 21); g.lineTo(23, 21); g.closePath();
 g.fillStyle = P.surface; g.fill(); g.strokeStyle = P.ink; g.lineWidth = 2; g.lineJoin = 'round'; g.stroke(); g.restore();
}

// Columna izquierda de cada proyecto: rótulo del bloque, título, la frase de la ficha y su línea de hechos.
const HX = 150, HW = 620;
function projectHead(g, u, { code, group, title, pitch, facts, out = 0 }) {
 const kk = seg(u, .1, .6), a = 1 - out;
 rule(g, HX, 262, 44 * E.outExpo(kk), P.acc, 2);
 T(g, typed(`${code}  ${group}`, kk * 1.4), HX + 60, 270, { size: 16, f: 'Mono', w: 600, c: P.acc, sp: 2.5, a });
 // Un título largo baja de tamaño antes que irse a tres renglones.
 let to = { size: 76, w: 650, sp: -1.5 }, tl = wrap(g, title, HW + 40, to);
 if (tl.length > 2) { to = { ...to, size: 62 }; tl = wrap(g, title, HW + 40, to); }
 let y = 350;
 tl.forEach((l, i) => { rise(g, l, HX, y, seg(u, .2 + i * .12, 1.0 + i * .12), to, out); y += to.size * 1.1; });
 const po = { size: 27, w: 400, st: 'normal', c: P.ink }, pl = wrap(g, pitch, HW - 40, po);

 pl.forEach((l, i) => { const k = E.outCubic(seg(u, .7 + i * .08, 1.2 + i * .08)); T(g, l, HX, y + (1 - k) * 14 - E.inExpo(out) * 20, { ...po, a: k * a }); y += 38; });
 y += 30; rule(g, HX, y - 26, HW - 40, A(P.ink, .25 * E.outCubic(seg(u, 1.0, 1.5)) * a));
 facts.forEach((f, i) => { const k = seg(u, 1.15 + i * .22, 1.6 + i * .22); T(g, typed(f, k), HX, y + i * 30, { size: 16, f: 'Mono', w: 500, c: P.muted, a }); });
}

// ——— 00 · Portada ———
function sIntro(g, u, t) {
 backdrop(g);
 const full = 'bruno salas', mo = { size: 46, f: 'Mono', w: 500, c: P.muted }, x0 = 960 - TW(g, full, mo) / 2, y0 = 560;
 const kt = seg(u, .65, 1.4), mout = seg(u, 1.6, 1.95);

  const s = typed(full, kt);
  if (s) rise(g, s, x0, y0, 1, mo, mout, .02);

 // El cajetín de la portada de la web, con los mismos cuatro datos.
 const rows = [['LUGAR', 'Monterrey, N. L.'], ['CARRERA', 'Ing. en Software · UANL 2023–2028'], ['IDIOMAS', 'ES / EN / PT'], ['HOJA', '00 · Portada']];
 const ky = 800, kr = E.outExpo(seg(u, 2.9, 3.6)), cw = (W - 300) / 4;
 rule(g, 150, ky, (W - 300) * kr, A(P.ink, 1 - out));
 rows.forEach(([k, v], i) => {
  const kc = seg(u, 3.1 + i * .12, 3.7 + i * .12), x = 150 + i * cw;
  if (i) { g.fillStyle = A(P.line, 1 - out); g.fillRect(x - 16, ky + 18, 1, 62 * kc); }
  T(g, typed(k, kc * 2), x, ky + 40, { size: 13, f: 'Mono', w: 500, c: P.muted, sp: 2, a: 1 - out });
  T(g, typed(v, kc), x, ky + 76, { size: 21, w: 500, st: 'normal', a: 1 - out });
 });
}

// ——— Lo que hay en el portafolio ———
function sMani(g, u, t) {
 backdrop(g);
 const out = seg(u, 2.95, 3.35), mo = { size: 112, w: 650, sp: -3 };
 rise(g, 'Herramientas para planta', 150, 400, seg(u, .3, 1.0), mo, out);

 const ks = E.outCubic(seg(u, 1.25, 1.75)), w = TW(g, 'planta', mo), x = 150 + TW(g, 'Herramientas para ', mo);

 const note = 'Las demos corren en el navegador con datos de ejemplo.', kn = seg(u, 1.5, 2.5), nm = { size: 20, f: 'Mono', w: 500, c: P.muted };
 const s = typed(note, kn);
 T(g, s, 150, 800, { ...nm, a: 1 - out });
 if (kn > 0 && out === 0) caret(g, 150 + TW(g, s, nm), 800, 20, t, kn < 1);
}

// ——— A · 01 · Entrega de turno ———
const SEVC = { 'CRÍTICA': P.bad, 'MAYOR': P.warn, 'MENOR': P.muted };
const COLS = [['ABIERTAS', P.bad], ['EN CURSO', P.warn], ['CERRADAS', P.ok]], CX = [860, 1170, 1480], CY = 320;
// Las cuatro incidencias de la demo, con su línea, lote y responsable.
const INC = [
 { id: 'INC-232', sev: 'CRÍTICA', title: 'Torque fuera de rango', where: 'L1 · lote 4420', owner: 'R. Garza', ownerAt: 2.05, kf: [[0, 0, 0], [1.3, 0, 0], [2.0, 1, 0]] },
 { id: 'INC-231', sev: 'MAYOR', title: 'Burbuja en pintura', where: 'L2 · lote 4424', owner: null, kf: [[0, 0, 1], [1.45, 0, 1], [1.85, 0, 0]] },
 { id: 'INC-229', sev: 'MAYOR', title: 'Fuga en sello', where: 'L3 · lote 4422', owner: 'L. Treviño', photo: true, kf: [[0, 1, 0], [1.3, 1, 0], [1.7, 1, 1], [2.55, 1, 1], [3.25, 2, 0]] },
 { id: 'INC-226', sev: 'MENOR', title: 'Rayón en puerta', where: 'L1 · lote 4411', owner: 'A. Cantú', photo: true, kf: [[0, 2, 0], [2.55, 2, 0], [2.95, 2, 1]] },
];
const slotXY = (c, s) => [CX[c] + 14, CY + 56 + s * 112];
function incPos(kf, u) {
 for (let i = 0; i < kf.length - 1; i++) {
  const [t0, c0, s0] = kf[i], [t1, c1, s1] = kf[i + 1];
  if (u <= t1) { const k = E.inOutCubic(seg(u, t0, t1)), a = slotXY(c0, s0), b = slotXY(c1, s1), lift = c0 !== c1 ? Math.sin(Math.PI * k) : 0; return { x: lerp(a[0], b[0], k), y: lerp(a[1], b[1], k) - lift * 40, lift, col: k > .5 ? c1 : c0 }; }
 }
 const [, c, s] = kf[kf.length - 1], p = slotXY(c, s); return { x: p[0], y: p[1], lift: 0, col: c };
}
const LOG = [[2.05, 'INC-232', '→ en curso · R. Garza', P.ink], [3.3, 'INC-229', 'cerrada con evidencia · L. Treviño', P.ok], [4.2, 'INC-231', 'no se cierra: falta la foto de evidencia', P.bad], [5.05, 'TURNO', 'entregado · 2 pendientes', P.ink]];
const clockAt = u => { const s = 50396 + Math.floor(u), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60; return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
function incCard(g, c, x, y, u, o) {
 const w = 272, h = 100, col = SEVC[c.sev];
 g.save(); g.translate(x, y);
 // Al levantarla se separa del papel con un filete de tinta, no con sombra.
 box(g, 0, 0, w, h, o.err > 0 ? A(P.bad, .1 * o.err) : P.surface, o.lift > .05 ? P.ink : P.line, o.lift > .05 ? 1.5 : 1);
 g.fillStyle = col; g.fillRect(0, 0, 4, h);
 T(g, c.sev, 18, 26, { size: 11, f: 'Mono', w: 700, c: col, sp: 1.5 }); T(g, c.id, w - 14, 26, { size: 12, f: 'Mono', w: 600, c: P.muted, al: 'right' });
 T(g, c.title, 18, 56, { size: 17, w: 600, st: 'normal' });
 T(g, c.where, 18, 84, { size: 11.5, f: 'Mono', w: 500, c: P.muted });
 const showOwner = c.owner && (!c.ownerAt || u >= c.ownerAt);
 if (showOwner) T(g, c.owner, w - 14, 84, { size: 12.5, w: 500, st: 'normal', al: 'right', a: c.ownerAt ? seg(u, c.ownerAt, c.ownerAt + .25) : 1 });
 else T(g, 'sin responsable', w - 14, 84, { size: 11.5, f: 'Mono', w: 600, c: P.bad, al: 'right' });
 if (c.photo) { box(g, w - 120, 72, 16, 12, null, P.ok, 1.5); g.beginPath(); g.arc(w - 112, 78, 2.5, 0, 7); g.fillStyle = P.ok; g.fill(); }
 g.restore();
}
function sTurno(g, u, t) {
 backdrop(g);
 const out = seg(u, 6.65, 7.1);
 projectHead(g, u, { code: 'A · 01', group: 'TURNO EN PLANTA', title: 'Entrega de turno', pitch: 'Registro de incidencias de calidad para que el turno que entra sepa qué quedó abierto.', facts: ['React · TypeScript', 'Demo: registrar, asignar y cerrar con foto', 'Funcional · Android en desarrollo'], out });
 const kh = E.outExpo(seg(u, .2, .8)), done = u > 5.05;
 g.save(); g.globalAlpha = kh * (1 - out);
 T(g, clockAt(u), 1790, 262, { size: 50, f: 'Mono', w: 600, al: 'right', c: done ? P.ok : P.ink });
 const pr = clamp((50396 + u - 21600) / 28800); rule(g, 1490, 282, 300, P.line, 3); rule(g, 1490, 282, 300 * pr, P.ink, 3);
 T(g, done ? 'TURNO VESPERTINO · RECIBIDO' : 'MATUTINO → VESPERTINO · 14:00', 1790, 308, { size: 12, f: 'Mono', w: 600, c: P.muted, al: 'right', sp: 1.5 });
 const kb = E.outExpo(seg(u, 4.4, 4.8)), press = Math.sin(Math.PI * seg(u, 4.95, 5.15));
 if (kb > 0) { g.save(); g.globalAlpha *= kb; g.translate(860 + 118, 252); g.scale(1 - press * .04, 1 - press * .04);
  box(g, -118, -26, 236, 52, done ? P.surface : P.acc, done ? P.ok : P.acc, done ? 1.5 : 1);
  T(g, done ? 'Turno entregado' : 'Entregar turno  →', 0, 7, { size: 17, w: 600, st: 'normal', c: done ? P.ok : '#ffffff', al: 'center' }); g.restore(); }
 const km = E.inOutCubic(seg(u, 4.45, 4.9)), kl2 = E.inOutCubic(seg(u, 5.3, 5.8));
 const counts = [0, 0, 0], pos = INC.map(c => { const p = incPos(c.kf, u); counts[p.col]++; return p; });
 COLS.forEach(([n, c], i) => {
  const k = E.outExpo(seg(u, .25 + i * .08, .8 + i * .08)), x = CX[i];
  g.save(); g.globalAlpha *= k; g.translate(0, (1 - k) * 30);
  box(g, x, CY, 300, 372, P.surface2, null);
  g.fillStyle = c; g.fillRect(x + 16, CY + 24, 8, 8); T(g, n, x + 34, CY + 33, { size: 13, f: 'Mono', w: 700, sp: 2 });
  T(g, String(counts[i]), x + 284, CY + 33, { size: 13, f: 'Mono', w: 700, c, al: 'right' });
  rule(g, x + 14, CY + 44, 272, P.line);
  g.restore();
 });
 INC.map((c, i) => ({ c, i, p: pos[i] })).sort((a, b) => a.p.lift - b.p.lift).forEach(({ c, i, p }) => {

  // INC-231 intenta cerrarse sin foto y regresa: la demo no deja cerrar sin evidencia.
  if (c.id === 'INC-231') { const kt = seg(u, 3.55, 4.25), f = Math.sin(Math.PI * kt) * .4; x = lerp(x, CX[2] + 14, f); y -= Math.sin(Math.PI * kt) * 30; lift = Math.max(lift, Math.sin(Math.PI * kt) * .8); const ks = seg(u, 3.95, 4.5); x += Math.sin(u * 60) * 7 * (ks > 0 && ks < 1 ? 1 - ks : 0); err = ks > 0 ? 1 - seg(u, 4.4, 5.0) : 0; }
  g.save(); g.globalAlpha *= ke; incCard(g, c, x, y, u, { lift, err }); g.restore();
 });
 pointer(g, lerp(lerp(1150, 990, km), 1060, kl2), lerp(lerp(520, 258, km), 330, kl2), press, seg(u, 4.45, 4.6) * (1 - kl2));
 const KX = 860, KY = 718, kc = E.outExpo(seg(u, .6, 1.1));
 g.save(); g.globalAlpha *= kc; g.translate(0, (1 - kc) * 30);
 box(g, KX, KY, 930, 150, P.surface, P.ink);
 T(g, 'BITÁCORA · MATUTINO', KX + 22, KY + 30, { size: 12, f: 'Mono', w: 600, c: P.muted, sp: 2 }); rule(g, KX + 22, KY + 42, 886);
 let ly = KY + 72, lastEnd = 0;
 LOG.forEach(([t0, id, msg, c]) => {
  if (u < t0) return; const k = seg(u, t0, t0 + .35);
  T(g, clockAt(t0), KX + 22, ly, { size: 14, f: 'Mono', w: 500, c: P.muted }); T(g, id, KX + 122, ly, { size: 14, f: 'Mono', w: 700, c: P.acc });
  const s = typed(msg, k); T(g, s, KX + 214, ly, { size: 14, f: 'Mono', w: 500, c }); lastEnd = KX + 214 + TW(g, s, { size: 14, f: 'Mono', w: 500 }); ly += 22;
 });
 if (u < 2.05) caret(g, KX + 18, ly, 14, t, false, P.ink); else caret(g, lastEnd, ly - 22, 14, t, false, P.ink);
 g.restore();
 g.restore();
}

// ——— A · 02 · Analizador de CSV ———
// Las diez primeras filas de inspecciones_planta_marzo.csv, la muestra del analizador.
const ROWS = [
 ['Q-1041', '2026-03-02', 'Matutino', 'L1', 'Carrocería', '120'],
 ['Q-1042', '2026-03-02', 'Matutino', 'L1', 'Pintura', '118'],
 ['Q-1043', '2026-03-02', 'Vespertino', 'L2', 'Ensamble final', '96'],
 ['Q-1044', '2026-03-03', 'Vespertino', 'L2', 'Prueba de agua', '96'],
 ['Q-1045', '03/03/2026', 'Nocturno', 'L3', 'Carrocería', '80'],
 ['Q-1046', '2026-03-03', 'Nocturno', 'L3', 'PINTURA', '80'],
 ['Q-1047', '2026-03-04', 'Matutino', 'L1', 'Ensamble final', '1,120'],
 ['Q-1048', '2026-03-04', 'Matutino', 'L1', ' pintura', '122'],
 ['Q-1044', '2026-03-03', 'Vespertino', 'L2', 'Prueba de agua', '96'],

];
const BADS = [[4, 1, '2026-03-03'], [5, 4, 'Pintura'], [6, 5, '1120'], [7, 4, 'Pintura']], DUP = 8;
const COLX = [26, 130, 276, 408, 478, 874], HEAD = ['FOLIO', 'FECHA', 'TURNO', 'LÍNEA', 'ESTACIÓN', 'REVISADAS'];
// Rechazadas por línea en el archivo completo (23 filas, sin la repetida): lo que devuelve la consulta.
const BARS = [['L1', 35], ['L2', 27], ['L3', 101]], ORDER = [1, 2, 0], BMAX = 110;
const QUERY = 'SELECT linea, SUM(piezas_rechazadas) FROM datos GROUP BY linea ORDER BY 2 DESC';
function sCSV(g, u, t) {
 backdrop(g);
 const out = seg(u, 6.85, 7.3);
 projectHead(g, u, { code: 'A · 02', group: 'TURNO EN PLANTA', title: 'Analizador de CSV', pitch: 'Revisa y limpia reportes en CSV o Excel, para quien los arma a mano cada semana.', facts: ['TypeScript · React · SQLite en el navegador', 'Demo con tu archivo o uno de ejemplo', 'Funcional · el archivo no sale de tu equipo'], out });
 const X0 = 860, Y0 = 215, CW = 930, CH = 650, kc = E.outExpo(seg(u, .2, .95));
